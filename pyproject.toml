requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.91",
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "neo4j>=6.2.0",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "path",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
